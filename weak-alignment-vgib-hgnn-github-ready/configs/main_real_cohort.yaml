# Main real-cohort configuration
basic_path: data/data.csv
micro_path: data/micro.csv
brain_path: data/all_brain_result_1(3).csv
output_dir: outputs/main_real_cohort

id_col_basic: ID
id_col_micro: ID
id_col_brain: Subject_ID
label_col: Diagnosis

task_mode: binary_risk
top_k_species: 50
min_prevalence: 0.02
edge_rep: log1p

random_seed: 42
seeds: [42, 52, 62, 72, 82]
n_splits: 5

hidden_dim: 64
latent_dim: 32
num_layers: 2
heads: 2
dropout: 0.35
lr: 0.001
weight_decay: 0.0001
epochs: 250
patience: 40

beta_grid: [0.0, 0.00001, 0.0001, 0.0005, 0.001]
gamma_grid: [0.5, 1.0, 1.5, 2.0]
threshold_policy_grid: [max_risk_f1, max_recall_precision_floor, max_macro_f1]
